<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wisp × BiomniBench-DA</title>
  <meta name="description" content="Wisp Science on BiomniBench-DA. Same 50 tasks, same DeepSeek v4-pro judge, swapped agent models. Pass = score ≥ 0.70.">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,500|ibm-plex-sans:400,500,600,700|syne:700,800">
  <style>
    :root {
      --tile: #d5e2da;
      --tile-2: #c7d6cd;
      --ink: #13241c;
      --muted: #4d675b;
      --plate: #f3f7f4;
      --plate-2: #e8efe9;
      --edge: #b7c8bc;
      --pass: #1a7a62;
      --pass-ink: #0d4a3c;
      --fail: #8e3d55;
      --gold: #c4962a;
      --gold-soft: #e8d08a;
      --focus: #245a86;
      --empty: #c9d5cc;
      --shadow: 0 18px 40px rgba(19, 36, 28, .12);
      --display: "Syne", "Bahnschrift", "Arial Narrow", "PingFang SC", sans-serif;
      --body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --radius-plate: 20px;
      --well: 16px;
      --well-gap: 4px;
      --cluster-gap: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --tile: #11181a;
        --tile-2: #0c1214;
        --ink: #e7f1eb;
        --muted: #9bb0a5;
        --plate: #18211d;
        --plate-2: #121a17;
        --edge: #2c3b34;
        --pass: #4ec9b6;
        --pass-ink: #b7eee4;
        --fail: #e07a9a;
        --gold: #e6c15a;
        --gold-soft: #7a6428;
        --focus: #7eb4e0;
        --empty: #2a3832;
        --shadow: 0 18px 40px rgba(0, 0, 0, .45);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { color-scheme: light dark; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.5;
      background:
        radial-gradient(1200px 480px at 12% -10%, rgba(196, 150, 42, .10), transparent 55%),
        repeating-linear-gradient(90deg, var(--tile) 0 28px, var(--tile-2) 28px 29px);
    }

    a { color: var(--focus); text-underline-offset: 3px; }
    a:hover { color: var(--pass); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .skip {
      position: absolute;
      left: 12px;
      top: -40px;
      background: var(--plate);
      padding: 6px 10px;
      z-index: 20;
    }
    .skip:focus { top: 12px; }

    .wrap {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    header.top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 22px;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      letter-spacing: -.04em;
      line-height: .95;
      margin: 0;
    }
    h1 span.times { color: var(--gold); font-weight: 700; padding: 0 .08em; }
    .lede { max-width: 46rem; margin: 10px 0 0; color: var(--muted); }

    .lang {
      display: inline-flex;
      border: 1px solid var(--edge);
      background: var(--plate);
      border-radius: 999px;
      padding: 3px;
    }
    .lang button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 500 12px/1 var(--mono);
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--plate);
    }

    .card {
      background: linear-gradient(180deg, var(--plate), var(--plate-2));
      border: 1px solid var(--edge);
      border-radius: var(--radius-plate);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.55);
    }

    table.rank {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    table.rank th {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-align: right;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--edge);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    table.rank th:first-child,
    table.rank th:nth-child(2),
    table.rank td:first-child,
    table.rank td:nth-child(2) { text-align: left; }
    table.rank th[aria-sort="ascending"]::after { content: " ↑"; }
    table.rank th[aria-sort="descending"]::after { content: " ↓"; }
    table.rank td {
      padding: 14px 14px;
      border-bottom: 1px solid var(--edge);
      vertical-align: middle;
      font-family: var(--mono);
      font-size: 13px;
      text-align: right;
    }
    table.rank td:nth-child(2) {
      font-family: var(--body);
      font-weight: 600;
      font-size: 15px;
    }
    table.rank tr.sum-row { cursor: pointer; }
    table.rank tr.sum-row:hover td { background: color-mix(in srgb, var(--gold-soft) 22%, transparent); }
    table.rank tr.sum-row.is-open td { background: color-mix(in srgb, var(--gold) 14%, transparent); }
    table.rank tbody tr.detail-row td {
      padding: 0;
      border-bottom: 1px solid var(--edge);
      text-align: left;
      font-family: var(--body);
    }
    table.rank tbody tr:last-child td { border-bottom: 0; }
    .rank-n {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -.04em;
      line-height: 1;
      text-align: left;
    }
    .pass-n { font-weight: 600; }
    .bar {
      height: 5px;
      width: 64px;
      margin-left: auto;
      background: var(--empty);
      border-radius: 99px;
      margin-top: 6px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--pass);
      border-radius: 99px;
    }
    .chev { font-size: 12px; color: var(--muted); text-align: center; }
    tr.is-open .chev { color: var(--ink); }

    .detail {
      display: none;
      padding: 8px 16px 18px;
      background: color-mix(in srgb, var(--plate-2) 70%, transparent);
    }
    tr.is-open + tr.detail-row .detail { display: block; }

    .detail-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      flex-wrap: wrap;
      margin: 8px 0 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend { display: flex; gap: 14px; align-items: center; }
    .swatch {
      width: var(--well);
      height: var(--well);
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
      box-shadow: inset 0 2px 3px rgba(19,36,28,.2);
    }
    .swatch.pass {
      background: var(--pass);
      box-shadow: 0 0 0 1.5px var(--gold), inset 0 2px 3px rgba(19,36,28,.2);
    }
    .swatch.fail { background: hsl(340 38% 62%); }

    .clusters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px var(--cluster-gap);
    }
    .cluster {
      display: flex;
      flex-wrap: wrap;
      gap: var(--well-gap);
      justify-content: center;
      width: max(3.2em, calc(var(--n) * var(--well) + (var(--n) - 1) * var(--well-gap)));
    }
    .cluster-label {
      flex: 1 0 100%;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      letter-spacing: .04em;
    }

    .well {
      width: var(--well);
      height: var(--well);
      border-radius: 50%;
      border: 1px solid rgba(19, 36, 28, .12);
      padding: 0;
      cursor: pointer;
      background: var(--empty);
      box-shadow: inset 0 2px 3px rgba(19, 36, 28, .18);
      flex: 0 0 var(--well);
    }
    .well.is-pass {
      box-shadow: 0 0 0 1.5px var(--gold), inset 0 2px 3px rgba(19, 36, 28, .22);
    }
    .well:hover, .well:focus-visible { transform: scale(1.35); }

    .mini-wrap {
      max-height: 360px;
      overflow-y: auto;
      margin-top: 12px;
      border: 1px solid var(--edge);
      border-radius: 12px;
    }
    .mini {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    .mini thead th {
      position: sticky;
      top: 0;
      background: var(--plate);
      z-index: 1;
    }
    .mini th, .mini td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--edge);
      font-size: 13px;
      text-align: right;
    }
    .mini th {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-align: right;
    }
    .mini th:first-child, .mini td:first-child,
    .mini th:nth-child(2), .mini td:nth-child(2) { text-align: left; }
    .mini td:first-child { font-family: var(--mono); font-size: 12px; }
    .mini tbody tr.is-hl td { background: color-mix(in srgb, var(--gold) 22%, var(--plate)); }
    .mini tbody tr:hover td { background: color-mix(in srgb, var(--gold-soft) 28%, var(--plate)); }

    button.score {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      cursor: pointer;
    }
    .score {
      font-family: var(--mono);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    button.score:hover { text-decoration: underline; }
    .mini tbody tr { cursor: pointer; }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset 0 1px 1px rgba(19,36,28,.25);
    }
    .dot.pass { box-shadow: 0 0 0 1.5px var(--gold), inset 0 1px 1px rgba(19,36,28,.25); }
    .best { font-weight: 600; }
    .tag {
      font-family: var(--mono);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 99px;
      border: 1px solid var(--edge);
    }
    .tag.ok { color: var(--pass-ink); border-color: color-mix(in srgb, var(--pass) 45%, var(--edge)); }
    .tag.no { color: var(--fail); }

    .compare { margin-top: 22px; }
    .compare > summary {
      cursor: pointer;
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -.03em;
      list-style: none;
      padding: 14px 18px;
    }
    .compare > summary::-webkit-details-marker { display: none; }
    .compare > summary::before {
      content: "▸ ";
      color: var(--gold);
      font-family: var(--mono);
      font-size: 14px;
    }
    .compare[open] > summary::before { content: "▾ "; }
    .compare-body { padding: 0 16px 18px; }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 0 0 12px;
    }
    .filters button {
      appearance: none;
      border: 1px solid var(--edge);
      background: transparent;
      color: var(--muted);
      font: 500 12px/1 var(--mono);
      padding: 7px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--plate);
      border-color: var(--ink);
    }

    .table-wrap { overflow-x: auto; }
    table.matrix {
      border-collapse: collapse;
      width: 100%;
      min-width: 720px;
      font-variant-numeric: tabular-nums;
    }
    table.matrix th, table.matrix td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--edge);
      text-align: right;
      font-size: 13px;
    }
    table.matrix th {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      background: var(--plate);
    }
    table.matrix th:first-child, table.matrix td:first-child,
    table.matrix th:nth-child(2), table.matrix td:nth-child(2) { text-align: left; }
    table.matrix td:first-child { font-family: var(--mono); font-size: 12px; }
    table.matrix th[aria-sort="ascending"]::after { content: " ↑"; }
    table.matrix th[aria-sort="descending"]::after { content: " ↓"; }
    table.matrix tbody tr:hover td { background: color-mix(in srgb, var(--gold-soft) 28%, var(--plate)); }
    table.matrix tbody tr.is-hl td { background: color-mix(in srgb, var(--gold) 22%, var(--plate)); }

    #tip {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      background: var(--ink);
      color: var(--plate);
      font-size: 12px;
      line-height: 1.45;
      padding: 8px 10px;
      border-radius: 10px;
      max-width: 240px;
      transform: translate(12px, 12px);
      box-shadow: 0 10px 24px rgba(19,36,28,.28);
      display: none;
    }
    #tip .k { font-family: var(--mono); font-size: 11px; opacity: .8; }

    .sheet[hidden] { display: none; }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
    }
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(19, 36, 28, .35);
    }
    .sheet-panel {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: min(640px, 100%);
      background: var(--plate);
      color: var(--ink);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding: 16px 18px 10px;
      border-bottom: 1px solid var(--edge);
    }
    .sheet-head h3 {
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: -.03em;
      margin: 0;
    }
    .sheet-x {
      appearance: none;
      border: 1px solid var(--edge);
      background: transparent;
      color: var(--ink);
      font: 500 12px/1 var(--mono);
      padding: 7px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .sheet-meta {
      padding: 10px 18px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .sheet-body {
      padding: 0 18px 24px;
      overflow: auto;
      flex: 1;
    }
    .sheet-body h4 {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 8px;
    }
    .notes, .answer, .err {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13.5px;
      line-height: 1.55;
      margin: 0;
    }
    .answer {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--plate-2);
      border: 1px solid var(--edge);
      border-radius: 12px;
      padding: 12px;
    }
    .err { color: var(--fail); }

    footer.foot {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px dashed var(--edge);
      color: var(--muted);
      font-size: 13px;
      display: grid;
      gap: 8px;
    }

    @media (max-width: 800px) {
      .acc, .time, .tools { display: none; }
      .wrap { width: calc(100% - 20px); }
      header.top { flex-direction: column; align-items: flex-start; }
      h1 { font-size: 2rem; }
      table.rank td, table.rank th { padding: 12px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .well { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#board" data-i18n="skip"></a>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow">omicos-biomnibench</p>
        <h1>Wisp <span class="times" aria-hidden="true">×</span> BiomniBench-DA</h1>
        <p class="lede" data-i18n="lede"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <section class="card" id="board" aria-labelledby="board-h">
      <table class="rank" id="rank"></table>
    </section>

    <details class="card compare" id="compare">
      <summary data-i18n="compare_title"></summary>
      <div class="compare-body">
        <p class="caption" data-i18n="click_cell" style="margin:0 0 12px;color:var(--muted);font-size:13px"></p>
        <div class="filters" role="tablist">
          <button type="button" data-filter="all" aria-pressed="true" data-i18n="filter_all"></button>
          <button type="button" data-filter="split" aria-pressed="false" data-i18n="filter_split"></button>
          <button type="button" data-filter="fail" aria-pressed="false" data-i18n="filter_fail"></button>
          <button type="button" data-filter="unique" aria-pressed="false" data-i18n="filter_unique"></button>
        </div>
        <div class="table-wrap">
          <table class="matrix" id="matrix"></table>
        </div>
      </div>
    </details>

    <footer class="foot">
      <div data-i18n="foot_protocol"></div>
      <div data-i18n="foot_build"></div>
      <div>
        <a href="https://github.com/xuzhougeng/wisp-science">wisp-science</a>
        ·
        <a href="https://huggingface.co/datasets/phylobio/BiomniBench-DA">BiomniBench-DA</a>
        ·
        <a href="https://github.com/wisp-science/wisp-science-benchmark">benchmark repo</a>
        ·
        <a href="https://github.com/wisp-science/wisp-science-benchmark/blob/main/omicos-biomnibench/README.md">protocol</a>
      </div>
    </footer>
  </div>
  <div id="tip" role="tooltip"></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <aside class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button type="button" class="sheet-x" data-close data-i18n="close"></button>
      </div>
      <div class="sheet-meta" id="sheet-meta"></div>
      <div class="sheet-body">
        <h4 data-i18n="judge_notes"></h4>
        <p class="notes" id="sheet-notes"></p>
        <h4 data-i18n="error_word" id="sheet-err-h" hidden></h4>
        <p class="err" id="sheet-err" hidden></p>
        <h4 data-i18n="model_answer"></h4>
        <pre class="answer" id="sheet-answer"></pre>
      </div>
    </aside>
  </div>
  <script type="application/json" id="bench-data">@@BENCH_DATA@@</script>
  <script>
    const DATA = JSON.parse(document.getElementById("bench-data").textContent);
    const THRESHOLD = DATA.protocol.pass_threshold;
    const I18N = {
      zh: {
        lede: "同一套 BiomniBench-DA 公开题（50 道）、同一位评审模型 DeepSeek v4-pro，只更换 Wisp 智能体背后的大模型。rubric 得分 ≥ 0.70 记为及格。先看总表，点开一行看该模型每一题。",
        skip: "跳到排行榜",
        col_rank: "#",
        col_model: "模型",
        col_pass: "及格",
        col_acc: "正确率",
        col_mean: "均分",
        col_time: "中位耗时",
        col_tools: "中位工具",
        col_task: "题目",
        col_paper: "论文",
        col_score: "得分",
        col_result: "结果",
        col_spread: "最大分差",
        open_row: "查看逐题",
        close_row: "收起",
        detail_caption: "按来源论文分组。颜色深浅是 0–1 分，金圈为及格。点圆孔会滚到下面这张逐题表。",
        compare_title: "逐题对比（所有模型）",
        click_cell: "点某个分数，查看该题的模型作答和评审意见（来自各 run 的 matrix.csv）。",
        judge_notes: "评审意见",
        model_answer: "模型作答",
        close: "关闭",
        error_word: "错误",
        source_csv: "来自 matrix.csv",
        trace_missing: "读不到 cells.json。请用 GitHub Pages 或本地 HTTP 打开本页，不要直接双击 HTML。",
        loading: "正在载入作答…",
        filter_all: "全部 50 题",
        filter_split: "模型有分歧",
        filter_fail: "全员不及格",
        filter_unique: "仅一个模型及格",
        leg_pass: "及格 ≥ 0.70",
        leg_fail: "不及格",
        pass_word: "及格",
        fail_word: "不及格",
        min: "分钟",
        tools: "次工具",
        score_word: "得分",
        foot_protocol: "答题方固定为 wisp-science（backend wisp），评审模型固定为 deepseek-v4-pro；不同评审模型给出的分数不可直接横向比较。",
        foot_build: "本页由 omicos-biomnibench/reports/build_index.py 汇总各次 run 的 matrix.csv 生成（生成日期 @@GENERATED_AT@@）。新增模型：将 biology-bench 产出的报告目录放入 reports/ 后重新运行该脚本。",
      },
      en: {
        lede: "Same 50 public BiomniBench-DA tasks, same judge (DeepSeek v4-pro) — only the model behind the Wisp agent changes. Pass = rubric score ≥ 0.70. Start with the ranking table; open a row for that model’s per-task scores.",
        skip: "Skip to ranking",
        col_rank: "#",
        col_model: "model",
        col_pass: "passed",
        col_acc: "accuracy",
        col_mean: "mean",
        col_time: "median time",
        col_tools: "median tools",
        col_task: "task",
        col_paper: "paper",
        col_score: "score",
        col_result: "result",
        col_spread: "max gap",
        open_row: "Per-task scores",
        close_row: "Close",
        detail_caption: "Grouped by source paper. Fill is the 0–1 score; a gold ring marks a pass. Click a well to jump to that row in the table.",
        compare_title: "Per-task comparison (all models)",
        click_cell: "Click a score to read that run’s answer and judge notes (from each run’s matrix.csv).",
        judge_notes: "Judge notes",
        model_answer: "Model answer",
        close: "Close",
        error_word: "Error",
        source_csv: "from matrix.csv",
        trace_missing: "Could not load cells.json. Open this page over GitHub Pages or a local HTTP server, not as a file://.",
        loading: "Loading answer…",
        filter_all: "All 50 tasks",
        filter_split: "Models disagree",
        filter_fail: "No model passed",
        filter_unique: "Only one model passed",
        leg_pass: "pass ≥ 0.70",
        leg_fail: "fail",
        pass_word: "pass",
        fail_word: "fail",
        min: "min",
        tools: "calls",
        score_word: "score",
        foot_protocol: "The agent is fixed to wisp-science (backend wisp) and the judge to deepseek-v4-pro. Scores produced by different judges are not directly comparable.",
        foot_build: "Built by omicos-biomnibench/reports/build_index.py from the matrix.csv of each run (generated @@GENERATED_AT@@). To add a model, drop the biology-bench report folder into reports/ and rerun the script.",
      },
    };

    const state = {
      lang: localStorage.getItem("biomni-lang") || "zh",
      filter: "all",
      rankSort: "rank",
      rankDir: 1,
      matrixSort: "task",
      matrixDir: 1,
      openId: null,
    };

    function t(key) { return I18N[state.lang][key]; }
    function fmtScore(v, digits) {
      return v == null ? "—" : Number(v).toFixed(digits == null ? 2 : digits);
    }
    function fmtMin(seconds) {
      if (seconds == null) return "—";
      return (seconds / 60).toFixed(1);
    }
    function fmtPct(v) { return (v * 100).toFixed(0) + "%"; }
    function cell(modelId, taskId) {
      return (DATA.cells[modelId] || {})[taskId] || null;
    }
    function paperGroups() {
      const groups = [];
      let cur = null;
      for (const task of DATA.tasks) {
        if (!cur || cur.paper !== task.paper) {
          cur = { paper: task.paper, tasks: [] };
          groups.push(cur);
        }
        cur.tasks.push(task);
      }
      return groups;
    }
    function verdict(taskId) {
      const n = DATA.models.filter((m) => cell(m.id, taskId)?.pass).length;
      if (n === 0) return "fail";
      if (n === DATA.models.length) return "all";
      if (n === 1) return "unique";
      return "split";
    }
    function matchFilter(taskId) {
      const v = verdict(taskId);
      if (state.filter === "all") return true;
      if (state.filter === "fail") return v === "fail";
      if (state.filter === "unique") return v === "unique";
      if (state.filter === "split") return v === "split" || v === "unique";
      return true;
    }
    function scoreColor(score, passed) {
      if (score == null) return "var(--empty)";
      if (passed) {
        const u = Math.min(1, Math.max(0, (score - THRESHOLD) / (1 - THRESHOLD)));
        return "hsl(162 " + (58 + u * 12) + "% " + (46 - u * 16) + "%)";
      }
      const u = Math.min(1, Math.max(0, score / THRESHOLD));
      return "hsl(340 " + (16 + u * 28) + "% " + (74 - u * 20) + "%)";
    }
    function bestScore(taskId) {
      let best = -1;
      for (const m of DATA.models) {
        const s = cell(m.id, taskId)?.score;
        if (s != null && s > best) best = s;
      }
      return best;
    }
    function spread(taskId) {
      const scores = DATA.models.map((m) => cell(m.id, taskId)?.score).filter((v) => v != null);
      if (!scores.length) return 0;
      return Math.max(...scores) - Math.min(...scores);
    }

    function applyI18n() {
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.innerHTML = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll(".lang button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === state.lang ? "true" : "false");
      });
    }

    function rankedModels() {
      const rows = DATA.models.map((m, i) => Object.assign({ rank: i + 1 }, m));
      const dir = state.rankDir;
      const key = state.rankSort;
      rows.sort((a, b) => {
        if (key === "label") return a.label.localeCompare(b.label) * dir;
        if (key === "rank") return (a.rank - b.rank) * dir;
        const va = a[key] ?? -1;
        const vb = b[key] ?? -1;
        return (va - vb) * dir;
      });
      return rows;
    }

    function wellsHtml(modelId) {
      return paperGroups().map((g) => {
        const wells = g.tasks.map((task) => {
          const c = cell(modelId, task.id);
          const score = c ? c.score : null;
          const passed = !!(c && c.pass);
          const ring = passed ? " is-pass" : "";
          return `<button type="button" class="well${ring}" data-model="${modelId}" data-task="${task.id}" style="background:${scoreColor(score, passed)}" aria-label="${task.id} ${fmtScore(score)}"></button>`;
        }).join("");
        return `<div class="cluster" style="--n:${g.tasks.length}"><span class="cluster-label">DA-${g.paper}</span>${wells}</div>`;
      }).join("");
    }

    function miniTable(modelId) {
      const rows = DATA.tasks.map((task) => {
        const c = cell(modelId, task.id) || {};
        const passed = !!c.pass;
        return `<tr data-model="${modelId}" data-task="${task.id}">
          <td>${task.id}</td>
          <td>DA-${task.paper}</td>
          <td><span class="score"><i class="dot ${passed ? "pass" : ""}" style="background:${scoreColor(c.score, passed)}"></i>${fmtScore(c.score)}</span></td>
          <td><span class="tag ${passed ? "ok" : "no"}">${passed ? t("pass_word") : t("fail_word")}</span></td>
          <td>${fmtMin(c.elapsed_s)} ${t("min")}</td>
          <td>${c.tool_calls ?? "—"}</td>
        </tr>`;
      }).join("");
      return `<div class="mini-wrap"><table class="mini">
        <thead><tr>
          <th>${t("col_task")}</th><th>${t("col_paper")}</th><th>${t("col_score")}</th>
          <th>${t("col_result")}</th><th>${t("col_time")}</th><th>${t("col_tools")}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    }

    function sortMark(key, current, dir) {
      if (key !== current) return "";
      return ` aria-sort="${dir > 0 ? "ascending" : "descending"}"`;
    }

    function renderBoard() {
      const table = document.getElementById("rank");
      const models = rankedModels();
      const head = `<thead><tr>
        <th data-rsort="rank"${sortMark("rank", state.rankSort, state.rankDir)}>${t("col_rank")}</th>
        <th data-rsort="label"${sortMark("label", state.rankSort, state.rankDir)}>${t("col_model")}</th>
        <th data-rsort="passed"${sortMark("passed", state.rankSort, state.rankDir)}>${t("col_pass")}</th>
        <th class="acc" data-rsort="accuracy"${sortMark("accuracy", state.rankSort, state.rankDir)}>${t("col_acc")}</th>
        <th data-rsort="mean_score"${sortMark("mean_score", state.rankSort, state.rankDir)}>${t("col_mean")}</th>
        <th class="time" data-rsort="median_elapsed_s"${sortMark("median_elapsed_s", state.rankSort, state.rankDir)}>${t("col_time")}</th>
        <th class="tools" data-rsort="median_tool_calls"${sortMark("median_tool_calls", state.rankSort, state.rankDir)}>${t("col_tools")}</th>
        <th></th>
      </tr></thead>`;
      const body = models.map((m) => {
        const open = state.openId === m.id;
        const pct = m.ran ? (100 * m.passed / m.ran) : 0;
        return `<tr class="sum-row ${open ? "is-open" : ""}" data-open="${m.id}" aria-expanded="${open ? "true" : "false"}">
            <td class="rank-n">${m.rank}</td>
            <td>${m.label}</td>
            <td><span class="pass-n">${m.passed}/${m.ran}</span><span class="bar"><span style="width:${pct}%"></span></span></td>
            <td class="acc">${fmtPct(m.accuracy)}</td>
            <td>${fmtScore(m.mean_score, 3)}</td>
            <td class="time">${fmtMin(m.median_elapsed_s)} ${t("min")}</td>
            <td class="tools">${m.median_tool_calls ?? "—"}</td>
            <td class="chev">${open ? "▾" : "▸"}</td>
          </tr>
          <tr class="detail-row">
            <td colspan="8">
              <div class="detail">
                <div class="detail-bar">
                  <span>${t("detail_caption")}</span>
                  <span class="legend">
                    <span><i class="swatch pass"></i>${t("leg_pass")}</span>
                    <span><i class="swatch fail"></i>${t("leg_fail")}</span>
                  </span>
                </div>
                <div class="clusters">${open ? wellsHtml(m.id) : ""}</div>
                ${open ? miniTable(m.id) : ""}
              </div>
            </td>
          </tr>`;
      }).join("");
      table.innerHTML = head + `<tbody>${body}</tbody>`;
    }

    function renderMatrix() {
      const table = document.getElementById("matrix");
      const modelHeads = DATA.models.map((m) =>
        `<th data-msort="${m.id}"${sortMark(m.id, state.matrixSort, state.matrixDir)}>${m.label}</th>`
      ).join("");
      const head = `<thead><tr>
        <th data-msort="task"${sortMark("task", state.matrixSort, state.matrixDir)}>${t("col_task")}</th>
        <th data-msort="paper"${sortMark("paper", state.matrixSort, state.matrixDir)}>${t("col_paper")}</th>
        ${modelHeads}
        <th data-msort="spread"${sortMark("spread", state.matrixSort, state.matrixDir)}>${t("col_spread")}</th>
      </tr></thead>`;
      const rows = DATA.tasks.filter((task) => matchFilter(task.id)).slice();
      const dir = state.matrixDir;
      const key = state.matrixSort;
      rows.sort((a, b) => {
        if (key === "task") return a.id.localeCompare(b.id, "en", { numeric: true }) * dir;
        if (key === "paper") return (Number(a.paper) - Number(b.paper) || a.id.localeCompare(b.id)) * dir;
        if (key === "spread") return (spread(a.id) - spread(b.id)) * dir;
        return ((cell(key, a.id)?.score ?? -1) - (cell(key, b.id)?.score ?? -1)) * dir;
      });
      const body = rows.map((task) => {
        const scores = DATA.models.map((m) => cell(m.id, task.id)?.score).filter((v) => v != null);
        const hi = bestScore(task.id);
        const cells = DATA.models.map((m) => {
          const c = cell(m.id, task.id);
          const score = c ? c.score : null;
          const passed = !!(c && c.pass);
          const isBest = score != null && score === hi && hi >= 0;
          return `<td><button type="button" class="score ${isBest ? "best" : ""}" data-model="${m.id}" data-task="${task.id}"><i class="dot ${passed ? "pass" : ""}" style="background:${scoreColor(score, passed)}"></i>${fmtScore(score)}</button></td>`;
        }).join("");
        const sp = scores.length ? (Math.max(...scores) - Math.min(...scores)).toFixed(2) : "—";
        return `<tr data-task="${task.id}"><td>${task.id}</td><td>DA-${task.paper}</td>${cells}<td class="score">${sp}</td></tr>`;
      }).join("");
      table.innerHTML = head + `<tbody>${body}</tbody>`;
    }

    function render() {
      applyI18n();
      renderBoard();
      renderMatrix();
    }

    function showTip(event, modelId, taskId) {
      const tip = document.getElementById("tip");
      const m = DATA.models.find((x) => x.id === modelId);
      const task = DATA.tasks.find((x) => x.id === taskId);
      const c = cell(modelId, taskId);
      if (!c) return;
      tip.innerHTML = `<div><b>${m.label}</b> · ${taskId} · DA-${task.paper}</div>
        <div class="k">${t("score_word")} ${fmtScore(c.score)} · ${c.pass ? t("pass_word") : t("fail_word")}</div>
        <div class="k">${fmtMin(c.elapsed_s)} ${t("min")} · ${c.tool_calls ?? "—"} ${t("tools")}</div>`;
      tip.style.display = "block";
      moveTip(event);
    }
    function moveTip(event) {
      const tip = document.getElementById("tip");
      const x = Math.min(event.clientX, window.innerWidth - 220);
      const y = Math.min(event.clientY, window.innerHeight - 90);
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    }
    function hideTip() { document.getElementById("tip").style.display = "none"; }

    function highlightTask(taskId) {
      document.querySelectorAll(".mini tbody tr, table.matrix tbody tr").forEach((tr) => {
        tr.classList.toggle("is-hl", tr.dataset.task === taskId);
      });
    }

    let TRACES = null;
    let tracesPromise = null;
    function loadTraces() {
      if (TRACES) return Promise.resolve(TRACES);
      if (!tracesPromise) {
        tracesPromise = fetch("cells.json")
          .then((r) => {
            if (!r.ok) throw new Error(String(r.status));
            return r.json();
          })
          .then((j) => {
            TRACES = j;
            return j;
          });
      }
      return tracesPromise;
    }

    function openCell(modelId, taskId) {
      hideTip();
      const m = DATA.models.find((x) => x.id === modelId);
      const task = DATA.tasks.find((x) => x.id === taskId);
      const c = cell(modelId, taskId) || {};
      const sheet = document.getElementById("sheet");
      document.getElementById("sheet-title").textContent = `${m.label} · ${taskId}`;
      document.getElementById("sheet-meta").textContent =
        `DA-${task.paper} · ${fmtScore(c.score)} ${c.pass ? t("pass_word") : t("fail_word")} · ${fmtMin(c.elapsed_s)} ${t("min")} · ${c.tool_calls ?? "—"} ${t("tools")} · ${t("source_csv")}`;
      document.getElementById("sheet-notes").textContent = t("loading");
      document.getElementById("sheet-answer").textContent = "";
      const errH = document.getElementById("sheet-err-h");
      const errP = document.getElementById("sheet-err");
      errH.hidden = true;
      errP.hidden = true;
      sheet.hidden = false;
      document.body.style.overflow = "hidden";
      highlightTask(taskId);
      loadTraces().then((tr) => {
        const rec = ((tr[modelId] || {})[taskId]) || {};
        document.getElementById("sheet-notes").textContent = rec.notes || "—";
        document.getElementById("sheet-answer").textContent = rec.answer || "—";
        if (rec.error) {
          errH.hidden = false;
          errP.hidden = false;
          errP.textContent = rec.error;
        }
      }).catch(() => {
        document.getElementById("sheet-notes").textContent = t("trace_missing");
        document.getElementById("sheet-answer").textContent = "";
      });
    }

    function closeSheet() {
      document.getElementById("sheet").hidden = true;
      document.body.style.overflow = "";
    }

    document.querySelector(".lang").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      state.lang = btn.dataset.lang;
      localStorage.setItem("biomni-lang", state.lang);
      render();
    });

    document.getElementById("rank").addEventListener("click", (e) => {
      const well = e.target.closest(".well");
      if (well) {
        openCell(well.dataset.model, well.dataset.task);
        return;
      }
      const mini = e.target.closest(".mini tbody tr[data-model][data-task]");
      if (mini) {
        openCell(mini.dataset.model, mini.dataset.task);
        return;
      }
      const th = e.target.closest("th[data-rsort]");
      if (th) {
        const key = th.dataset.rsort;
        if (state.rankSort === key) state.rankDir *= -1;
        else {
          state.rankSort = key;
          state.rankDir = key === "label" || key === "rank" ? 1 : -1;
        }
        renderBoard();
        return;
      }
      const row = e.target.closest("tr[data-open]");
      if (!row) return;
      const id = row.dataset.open;
      state.openId = state.openId === id ? null : id;
      renderBoard();
    });

    document.getElementById("rank").addEventListener("pointerover", (e) => {
      const well = e.target.closest(".well");
      if (!well) return;
      showTip(e, well.dataset.model, well.dataset.task);
    });
    document.getElementById("rank").addEventListener("pointermove", (e) => {
      if (e.target.closest(".well")) moveTip(e);
    });
    document.getElementById("rank").addEventListener("pointerout", (e) => {
      if (!e.relatedTarget || !e.relatedTarget.closest?.(".well")) hideTip();
    });
    document.querySelector(".filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      state.filter = btn.dataset.filter;
      document.querySelectorAll(".filters button").forEach((b) => {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      renderMatrix();
    });
    document.getElementById("matrix").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-model][data-task]");
      if (btn) {
        openCell(btn.dataset.model, btn.dataset.task);
        return;
      }
      const th = e.target.closest("th[data-msort]");
      if (!th) return;
      const key = th.dataset.msort;
      if (state.matrixSort === key) state.matrixDir *= -1;
      else {
        state.matrixSort = key;
        state.matrixDir = key === "task" || key === "paper" ? 1 : -1;
      }
      renderMatrix();
    });

    document.getElementById("sheet").addEventListener("click", (e) => {
      if (e.target.closest("[data-close]")) closeSheet();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSheet();
    });

    render();
  </script>
</body>
</html>
