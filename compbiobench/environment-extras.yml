# Extra packages installed into compbio-benchmark by `run_benchmark.py warmup`.
# Keep environment.yml close to the vendored runner; put timeout-prone tools here.
name: compbio-benchmark
channels:
  - conda-forge
  - bioconda
dependencies:
  - bowtie2
  - macs2
  - picard
  - cutadapt
  - chromap
  - kraken2
  - star
  - openjdk
  - wget
  - pigz
  - pip
  - pip:
    - caper
    - huggingface_hub
    # bioconda idr has no py3.11 build; bundled inv_cdf.c is pre-3.11 Cython.
    # warmup installs Cython<3 then pip --no-build-isolation this tarball.
    - https://github.com/kundajelab/idr/archive/refs/tags/2.0.4.2.tar.gz
